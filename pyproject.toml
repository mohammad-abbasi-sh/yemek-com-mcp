[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yemek-com-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Yemek.com Turkish recipes (search, full recipes, categories, daily picks)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7",
    "requests>=2.32",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
yemek-com-mcp = "yemek_com_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yemek_com_mcp"]
